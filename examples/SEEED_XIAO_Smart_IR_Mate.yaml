substitutions:
  name: aux-ir-device
  friendly_name: AUX IR device

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components            # folder next to this YAML
    components: [aux12]

# ---------------------------------------------------------------- logging
# Kept for protocol work: the AUX Protocol Lab reads "Received Raw:" lines over USB.
logger:
  level: DEBUG
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG  # XIAO ESP32-C3 native USB
  logs:
    remote_receiver: INFO         # per-pulse dumps off
    remote_base: INFO             # "Sending times=..." TX dumps off
    api.service: INFO
    climate: INFO
    aux12: DEBUG                  # decoded "TX ..." / "RX ..." frames

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------------------------------------------------------- IR hardware (Smart IR Mate)
remote_transmitter:
  id: ir_tx
  pin: GPIO3
  carrier_duty_percent: 50%

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO4
    inverted: true
    mode:
      input: true
      pullup: true
  dump: raw                       # for the Protocol Lab; remove to quiet the log
  tolerance: 30%
  filter: 20us
  idle: 30ms
  buffer_size: 20kb

# ---------------------------------------------------------------- AUX heat pump
climate:
  - platform: aux12
    id: aux_heat_pump
    name: "AUX Heat Pump"
    transmitter_id: ir_tx
    receiver_id: ir_rx            # keeps HA in sync with the handheld remote
    use_fahrenheit: true          # remote shows °F; exact 60–90 °F setpoints
    # sensor: room_temperature    # optional: current temperature in HA

switch:
  - platform: aux12
    aux12_id: aux_heat_pump
    turbo:
      name: "AUX Turbo"
    eco:
      name: "AUX Eco"
    sleep:
      name: "AUX Sleep"
    health:
      name: "AUX Health"
    fahrenheit:
      name: "AUX °F Display"

button:
  - platform: aux12
    aux12_id: aux_heat_pump
    display:
      name: "AUX Display Toggle"
    iclean:
      name: "AUX iClean"

number:
  - platform: aux12
    aux12_id: aux_heat_pump
    timer:
      name: "AUX Timer"
      mode: box
